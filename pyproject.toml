[project]
name = "dotlife"
version = "0.1.0a2"
description = "A small life dashboard built on a plain-file data format you own."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "altair>=6.3.0",
    "polars>=2.1.0",
    "streamlit>=1.66.1",
    "tzdata>=2026.6 ; sys_platform == 'win32'",
]

[project.scripts]
dotlife = "dotlife.cli:main"

[tool.uv]
required-version = ">=0.7.13"   # `make release` uses `uv version <value> --no-sync`

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "git-cliff>=2.14.2",
    "pymarkdownlnt>=0.9.41",
    "ruff>=0.17.3",
    "watchdog>=6.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "D", "RET", "SIM", "TID", "UP"]
ignore = ["D100", "D104"]                  # no module or package docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pymarkdown]
plugins.md013.enabled = false              # one paragraph per line; wide tables
plugins.md033.allowed_elements = "!--,div,details,summary"  # centered README header, collapsible sections
plugins.md024.siblings_only = true            # changelog releases repeat "Features" etc.
plugins.md041.enabled = false              # README opens with a centered block, not a heading
extensions.front-matter.enabled = true     # SKILL.md front matter
