[project]
name = "dotlife"
version = "0.1.0"
description = "A small life dashboard built on a plain-file data format you own."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pymarkdownlnt>=0.9.41",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pymarkdown]
plugins.md013.enabled = false              # one paragraph per line; wide tables
extensions.front-matter.enabled = true     # SKILL.md front matter
