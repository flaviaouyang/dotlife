# git-cliff configuration: https://git-cliff.org/docs/configuration
# `make release` uses it to pick the next version and write CHANGELOG.md.

[changelog]
header = """
# Changelog

What changed in each release of dotlife, for the people who use it.
"""
# Starts with a blank line so releases are separated.
body = """

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
# The changelog is for people who use dotlife, so it lists only what changes for
# them: features, fixes, speed-ups, docs and reverts. Work on dotlife itself
# (chore, ci, build, test, refactor, style, release and changelog commits) is left
# out, and so are commits that aren't Conventional Commits, such as merges. Use
# feat, fix or perf for a change users notice, whatever part of the repo it is in.
# The HTML comments set the order of the groups and are stripped from the output.
commit_parsers = [
    # Work on dotlife's own tooling and docs for contributors, under a user-facing
    # type: use the dev scope, e.g. "docs(dev): ...". The commits listed by hash
    # came before the scope existed.
    { message = "^[a-z]+\\(dev\\)", skip = true },
    { sha = "699e4bf6f49d3e9d9b5485f45d43fb368a99d22f", skip = true },
    { sha = "50ea22437774b0627134b6a2aa82e0d2ababf5f9", skip = true },
    { sha = "47a8f965ec5ff593fdc43d728f72a31205bcc294", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^docs?", group = "<!-- 3 -->Documentation" },
    { message = "^revert", group = "<!-- 4 -->Reverts" },
    { message = ".*", skip = true },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"

[bump]
# dotlife starts in alpha. While the latest tag is a pre-release, each release bumps
# its number (alpha.1, alpha.2, ...). Leaving alpha is chosen by hand, e.g.
# make release VERSION=v0.1.0-beta.1 or VERSION=v0.1.0.
# After that, before 1.0, features and breaking changes bump the minor version.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0-alpha.1"
