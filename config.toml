# dotlife settings: every threshold and personal choice lives here.
# Hard limits that define the format (e.g. at most 1440 minutes a day) are in the code;
# FORMAT.md lists them.

format_version = 1
timezone = "Europe/Berlin"   # IANA name; dates, weeks and wake dates use it
data_dir = "data"            # falls back to sample/ when this folder is missing

[display]
weight = "kg"                # "kg" or "lb"; files always store kg
glucose = "mmol/L"           # "mmol/L" or "mg/dL"; files always store mmol/L

[dashboard]
period = "week"              # "week" (Monday to Sunday) or "month"
show_sensitive = false       # sensitive categories stay hidden until shown in the dashboard
usual_range = { week = 8, month = 6 }   # full periods behind the "usual range" band
pinned_cards = []            # Overview cards shown first, e.g. "activity.steps"
hidden_cards = []            # Overview cards left out
pinned_categories = []       # Trends categories shown first, e.g. "sleep"
hidden_categories = []       # Trends categories left out

# Categories: activity, workouts, sleep, heart, body, fitness_markers, vitals,
# nutrition, mindfulness, cycle, medication, symptoms, glucose, mood, reflections, time,
# screen_time, tasks, habits, reading, learning, media, finances, events, weather,
# social, travel.
#
# Each shows when its file exists in data_dir. In its section, you can set:
#   enabled = false                                   switch it off everywhere
#   plausible = { <column> = [low, high] }            change when a value is a warning
#   stale_after_days = { <column> = days }            flag a value that stops changing
#   related = { <column> = ["category.column"] }      metrics for the stuck flag; [] = off
#   goals = { <column> = 10000 }                      a target, in the column's unit;
#           { <column> = { at_most = 70 } }           totals' goals are per week

[activity]
watch_off_steps = 1000            # a day under both of these counts as "watch not worn"
watch_off_sedentary_min = 480

[fitness_markers]
# Many watches only update VO2 max after an outdoor run with GPS.
stale_after_days = { vo2max_ml_kg_min = 90 }

[weather]
# Home location for the weather script, rounded to two decimals (about a kilometre).
# latitude = 51.51
# longitude = -0.13

[reflections]
time_format = "%Y-%m-%d %H:%M"    # for a jrnl file, use jrnl's "%Y-%m-%d %I:%M:%S %p"
tag_symbols = "#@"                # words starting with these are tags

[finances]
home_currency = "EUR"             # ISO 4217; other currencies are flagged, not converted
budgets = {}                      # monthly, in home_currency, e.g. { groceries = 400 }

# Source scripts `make fresh` runs, in order, from this folder. Each stages its
# rows in data/sources/<source>/, and make fresh merges them into data/ by the
# ranking in [sources]; exit code 0 means it finished. A script is a .py file
# run with dotlife's Python; a command is anything else; an agent step names
# the instructions your AI agent follows (its fetch skill runs those).
# [[fresh.steps]]
# name = "oura"
# script = "scripts/oura.py"
#
# [[fresh.steps]]
# name = "calendar"
# command = ["swift", "scripts/calendar.swift"]
#
# [[fresh.steps]]
# name = "mood-from-reflections"
# agent = "prompts/mood.md"

# Custom metrics: one table per metric, with its data in <name>.csv
# (columns date, source, value). See FORMAT.md.
# [custom.guitar]
# label = "Guitar practice"
# unit = "min"
# summary = "sum"
# higher_is_better = true
# minimum = 0
# maximum = 1440
# plausible = [0, 180]

# Per category, where its data comes from, best first; `dotlife setup` writes it.
[sources]
