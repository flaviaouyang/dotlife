# Alice's settings. dotlife uses this file, not the one in the repo root,
# whenever it reads this folder.

format_version = 1
timezone = "Europe/London"

[activity]
watch_off_steps = 1000
watch_off_sedentary_min = 480
goals = { steps = 10000, active_min = 150 }

[sleep]
goals = { asleep_min = 450 }

[screen_time]
goals = { screen_min = 180 }

[body]
goals = { weight_kg = { at_most = 72 } }

[fitness_markers]
stale_after_days = { vo2max_ml_kg_min = 90 }

[finances]
home_currency = "GBP"
budgets = { coffee = 60, books = 40, restaurants = 150 }

[custom.puzzles]
label = "Puzzles solved"
unit = "puzzles"
summary = "sum"
minimum = 0
plausible = [0, 10]
